name: CI

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser for this manual regression run
        type: choice
        default: chromium
        options:
          - chromium
          - webkit
  push:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.browser == 'webkit' && 'webkit' || 'chromium' }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            range="$BEFORE_SHA..$HEAD_SHA"
          else
            range="$HEAD_SHA"
          fi

          git rev-list --no-merges "$range" | while read -r commit; do
            git show -s --format=%B "$commit" | npm run --silent commitlint
          done
      - name: Upload frontend build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: ${{ inputs.browser == 'webkit' && 'webkit' || 'browser' }} (${{ matrix.shard }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    env:
      TEST_BROWSER: ${{ inputs.browser == 'webkit' && 'webkit' || 'chromium' }}
    # Longer than the browser suite's globalTimeout (playwright.config.ts) and
    # the steps around it, so a shard that runs out still uploads its report.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps "$TEST_BROWSER"
      - name: Browser regression tests
        id: browser-tests
        run: |
          if [ "$TEST_BROWSER" = "webkit" ]; then
            npm run test:browser:webkit -- --shard=${{ matrix.shard }}/${{ matrix.shardTotal }}
          else
            npm run test:browser -- --shard=${{ matrix.shard }}/${{ matrix.shardTotal }}
          fi
      - name: Upload browser report
        if: ${{ !cancelled() && (steps.browser-tests.outcome == 'failure' || (inputs.browser == 'webkit' && steps.browser-tests.outcome == 'success')) }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-report-${{ github.sha }}-${{ env.TEST_BROWSER }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
